openapi: 3.1.0
info:
  title: Research Hub External API
  version: 0.3.0
  description: |-
    APIs for external systems to manage the authenticated user's projects and files.
    Project metadata is stored in Cloud Firestore; file bytes are stored in private Cloudflare R2.
    Every request needs a HyperDataLab SSO access token for a verified @hyperdatalab.org user.
    Obtain it through the registered OAuth Authorization Code + PKCE client with scopes
    email, profile, and hyperdatalab_profile. The last scope is required for the role claim.
servers:
  - url: https://research-hub-files.hyperdatalab.workers.dev
    description: Production
  - url: http://127.0.0.1:8787
    description: Local Wrangler development server
security:
  - HyperDataLabBearer: []
paths:
  /api/tool-settings:
    get:
      summary: Read the shared PaperLab and Writing Lab URLs
      description: Available to authenticated, verified organization users so project workspaces can render their tool links.
      responses:
        "200":
          description: Shared tool URL configuration
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings: { $ref: "#/components/schemas/ToolSettings" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
  /api/session:
    post:
      summary: Register the current verified SSO account in the Research Hub directory
      description: Records the user's SSO subject and verified organization email so project owners can add users who have already signed in to Research Hub.
      responses:
        "200":
          description: Account registered
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [email, name]
                    properties:
                      email: { type: string, format: email }
                      name: { type: string }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
    put:
      summary: Update the shared PaperLab and Writing Lab URLs
      description: Only an SSO userinfo profile with role=admin may update the shared settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolSettings" }
      responses:
        "200":
          description: Updated shared tool URL configuration
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings: { $ref: "#/components/schemas/ToolSettings" }
        "400": { description: "Invalid JSON or tool URL; URLs must use HTTPS (HTTP is allowed for localhost)" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account is not an administrator or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
  /api/projects:
    get:
      summary: List projects owned by or shared with the current SSO user
      description: Returns up to 100 owned or shared projects, sorted by most recently updated. Archived projects are excluded unless includeDeleted=true.
      parameters:
        - in: query
          name: includeDeleted
          description: Include soft-deleted projects in the result.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Projects owned by or shared with the authenticated SSO subject
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
    post:
      summary: Create a project for the current SSO user
      description: Creates an active project owned by the authenticated SSO subject. Project metadata and files are available to its owner and explicitly added members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
                description: { type: string, maxLength: 1000, default: "" }
      responses:
        "201":
          description: Project created and owned by the authenticated SSO subject
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "400": { description: "Project name or description is invalid" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
  /api/projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Soft-delete a project
      description: Archives the project while retaining all associated files. Archived projects no longer accept uploads.
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "404": { description: "Project not found or not owned by the current SSO user" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
  /api/projects/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Restore an archived project
      description: Makes the project active again. Its files remain associated with it.
      responses:
        "200":
          description: Restored project
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "404": { description: "Project not found or not owned by the current SSO user" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
        "503": { description: "Firestore service account is not configured or lacks access" }
  /api/projects/{id}/members:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List project members
      description: Only the project owner can read the member list.
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
        "404": { description: "Project not found or caller is not the owner" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
    post:
      summary: Add a Research Hub user to a project
      description: Only the owner can add a user. The email must match a verified @hyperdatalab.org account that has previously signed in to Research Hub. Members receive full file and workspace access; only the owner can manage members or archive the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, pattern: '^[^@\\s]+@hyperdatalab\\.org$' }
      responses:
        "200":
          description: Updated project member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
        "400": { description: "Invalid or non-organization email" }
        "404": { description: "Project not found, user is not registered, or caller is not the owner" }
        "409": { description: "Project is archived, user is already a member, or project has reached its member limit" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
  /api/projects/{id}/members/{memberId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: memberId
        required: true
        description: SSO subject identifier returned as ProjectMember.id
        schema: { type: string, minLength: 1, maxLength: 128 }
    delete:
      summary: Remove a member from a project
      description: Only the project owner can remove a member. Removed users immediately lose project and file access.
      responses:
        "200":
          description: Updated project member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
        "404": { description: "Project or member not found, or caller is not the owner" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
  /api/files:
    get:
      summary: List the current user's files
      description: Returns up to 100 of the current user's own files when projectId is omitted. When projectId is supplied, returns files in that accessible project, including files uploaded by its owner and members. Legacy files may have projectId=null until assigned to a project.
      parameters:
        - in: query
          name: projectId
          description: List files belonging to this project. The caller must be its owner or member.
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: File page
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileItem" } }
                  cursor: { type: [string, "null"] }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
    post:
      summary: Upload one file (maximum 25 MB)
      description: Upload raw file bytes as the request body, not multipart/form-data. URL-encode the original filename in X-File-Name. Content-Type is retained as file metadata. Every upload must be assigned to an active project where the current user is owner or member.
      parameters:
        - in: header
          name: X-Project-Id
          required: true
          description: UUID of an active project where the current SSO user is owner or member.
          schema: { type: string, format: uuid }
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string, maxLength: 180 }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/FileItem" }
        "413": { description: "File exceeds 25 MB" }
        "400": { description: "Missing or invalid X-Project-Id or X-File-Name" }
        "404": { description: "Project not found or caller is not an owner/member" }
        "409": { description: "Project is archived" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
  /api/files/{id}/project:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Assign a file to a project
      description: Assigns or reassigns one of the current user's files to an active project where they are owner or member. Used to map legacy unassigned files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              additionalProperties: false
              properties:
                projectId: { type: string, format: uuid }
      responses:
        "200":
          description: File with updated project association
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/FileItem" }
        "400": { description: "Invalid JSON or projectId" }
        "404": { description: "File or accessible project not found" }
        "409": { description: "Project is archived" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
  /api/files/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Download a file owned by the current user or shared with their project
      description: Returns raw bytes with Content-Disposition attachment; the response is not JSON. Pass projectId for project files so project membership is checked.
      parameters:
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "File bytes, returned as an attachment" }
        "404": { description: "File not found" }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
    delete:
      summary: Delete a file owned by the current user or shared with their project
      parameters:
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401": { description: "Missing, expired, or invalid SSO access token" }
        "403": { description: "Account email is not verified under @hyperdatalab.org, or browser origin is not allowed" }
        "502": { description: "HyperDataLab SSO userinfo is unavailable" }
components:
  securitySchemes:
    HyperDataLabBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque OAuth access token
      description: Obtain from the registered HyperDataLab SSO OAuth Authorization Code + PKCE client using scopes email, profile, and hyperdatalab_profile. No API-key or service-token authentication is currently available.
  schemas:
    ToolSettings:
      type: object
      additionalProperties: false
      required: [paperLabUrl, writingLabUrl]
      properties:
        paperLabUrl: { type: string, maxLength: 2048, description: HTTPS URL (HTTP allowed for localhost development), or empty to disable PaperLab }
        writingLabUrl: { type: string, maxLength: 2048, description: HTTPS URL (HTTP allowed for localhost development), or empty to disable Writing Lab }
    Project:
      type: object
      required: [id, name, description, createdAt, updatedAt, deletedAt, ownerEmail, accessRole, memberCount, members]
      properties:
        id: { type: string, format: uuid, description: Stable project identifier for future Research Hub modules }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null while active; timestamp when archived }
        ownerEmail: { type: string, description: Owner's verified organization email; may be empty for older projects until their owner manages membership }
        accessRole: { type: string, enum: [owner, member] }
        memberCount: { type: integer, minimum: 0, maximum: 50 }
        members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" }, description: Contains member details for owners and is empty for members }
    ProjectMember:
      type: object
      required: [id, email, name, addedAt]
      properties:
        id: { type: string, description: SSO subject identifier; use to remove the member }
        email: { type: string, format: email }
        name: { type: string }
        addedAt: { type: string, format: date-time }
    FileItem:
      type: object
      required: [id, name, contentType, size, uploadedAt, projectId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 0 }
        uploadedAt: { type: string, format: date-time }
        projectId: { type: [string, "null"], format: uuid, description: Null only for legacy files until manually assigned }
